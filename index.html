:root { --brand:#F04828; --ink:#231A16; --mute:#6f625c; --line:#E7E5E0; --bg:#FAF7F3; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
header { position:sticky; top:0; z-index:2; background:#140000; color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
header h1 { margin:0; font-size:18px; flex:1; }
select, input[type=file], textarea { font:inherit; }
header select { background:#fff; border:0; border-radius:8px; padding:8px 10px; min-height:40px; }
main { max-width:720px; margin:auto; padding:16px; }
nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:2; }
nav button { flex:1; min-height:60px; padding:0 2px; white-space:nowrap; border:0; background:none; font:inherit; font-size:12px; color:var(--mute); cursor:pointer; }
nav button[aria-current=page] { color:var(--brand); font-weight:700; box-shadow:inset 0 3px var(--brand); }
h2 { font-size:20px; margin:0 0 4px; }
h3 { font-size:16px; margin:18px 0 8px; }
.sub { color:var(--mute); margin:0 0 14px; font-size:14px; }
.card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
.card.done { opacity:.55; }
.title { font-weight:700; color:var(--brand); text-decoration:none; font-size:17px; word-break:break-all; }
.meta { color:var(--mute); font-size:14px; margin:4px 0; }
.ticks { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; }
.ticks label { display:flex; align-items:center; gap:6px; min-height:36px; font-size:14px; cursor:pointer; }
.ticks input { width:20px; height:20px; accent-color:var(--brand); }
.btn { display:inline-block; background:var(--brand); color:#fff; border:0; border-radius:99px; padding:11px 20px; font:inherit; font-weight:600; cursor:pointer; min-height:44px; text-decoration:none; }
.btn.line { background:#fff; color:var(--ink); border:1px solid var(--line); padding:6px 14px; min-height:36px; font-size:14px; font-weight:500; }
.btn:disabled { opacity:.5; }
textarea { width:100%; min-height:140px; border:1px solid var(--line); border-radius:10px; padding:10px; }
.field { margin-bottom:12px; }
.field > label { display:block; font-weight:600; margin-bottom:4px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.grid img { width:100%; border-radius:8px; display:block; }
.bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.bar button:not(.btn) { border:1px solid var(--line); background:#fff; border-radius:99px; padding:6px 14px; min-height:38px; font:inherit; font-size:14px; cursor:pointer; }
.bar button:not(.btn)[aria-pressed=true] { background:var(--ink); color:#fff; }
.err { color:#b3261e; margin-top:8px; }
.tag { font-weight:700; }
.login { max-width:340px; margin:18vh auto 0; padding:16px; text-align:center; }
.login input { width:100%; font:inherit; font-size:20px; text-align:center; padding:12px; border:1px solid var(--line); border-radius:10px; margin:12px 0; }
.tpl { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; }
.tile { border:2px solid transparent; background:none; padding:0; border-radius:8px; cursor:pointer; overflow:hidden; line-height:0; min-height:100px; }
.tile:hover, .tile:focus-visible { border-color:var(--brand); }
.tile canvas { width:100%; height:auto; display:block; }
.strip { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; }
.mini { position:relative; flex:none; line-height:0; }
.mini canvas { border-radius:8px; }
.mini .x { position:absolute; top:-2px; right:-2px; width:28px; height:28px; border-radius:50%; border:0; background:#140000; color:#fff; font-size:16px; line-height:1; cursor:pointer; }
.previewBox { text-align:center; }
.preview { max-width:100%; max-height:70vh; border-radius:8px; touch-action:none; cursor:grab; background:#000; }
details.card > summary { font-weight:700; cursor:pointer; min-height:28px; }
details.card[open] > summary { margin-bottom:12px; }
.range { display:grid; grid-template-columns:90px 1fr 38px; gap:8px; align-items:center; margin-bottom:8px; font-size:14px; }
.range input { width:100%; accent-color:var(--brand); }
.val { text-align:right; color:var(--mute); }
.txt { width:100%; font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; }
select { max-width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
.msg { font-size:18px; line-height:1.5; margin:0 0 12px; min-height:54px; }
.linkBtn { background:none; border:0; padding:0; cursor:pointer; font-family:inherit; text-align:left; min-height:28px; text-decoration:underline; }
.sheet { position:fixed; inset:0; background:rgba(20,0,0,.55); z-index:9; display:flex; align-items:flex-end; justify-content:center; }
.sheetBox { background:#fff; width:100%; max-width:520px; max-height:85vh; overflow:auto; border-radius:16px 16px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; position:relative; }
.sheetBox .btn { text-align:center; }
.sheetBox label { display:block; font-weight:600; font-size:14px; margin-top:6px; }
.appRow { display:flex; gap:8px; }
.appRow .btn:first-child { flex:1; }
.x2 { position:absolute; top:10px; right:10px; width:36px; height:36px; border:0; background:none; font-size:24px; line-height:1; cursor:pointer; color:var(--mute); }
.assess { border-top:1px solid var(--line); margin-top:8px; padding-top:8px; }
.tagRow { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:6px; }
.tagName { width:66px; font-size:13px; color:var(--mute); }
.chip { border:1px solid var(--line); background:#fff; border-radius:99px; padding:4px 10px; min-height:32px; font:inherit; font-size:13px; cursor:pointer; }
.chip[aria-pressed=true] { background:var(--ink); color:#fff; }
.tagFoot { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.tagFoot .meta { margin:0; font-size:13px; }
.tier { font-size:12px; font-weight:700; border-radius:6px; padding:2px 8px; background:#E7E5E0; }
.tier[data-tier="Tốt"] { background:#08B917; color:#fff; }
.tier[data-tier="Khá"] { background:#FB923B; color:#140000; }
.tier[data-tier="Yếu"] { background:#231A16; color:#fff; }
header select { max-width:62%; }
.task { display:flex; gap:8px; align-items:flex-start; padding:6px 0; font-size:15px; cursor:pointer; }
.task input { width:20px; height:20px; flex:none; accent-color:var(--brand); }
.kpi { margin-bottom:10px; }
.kpiTop { display:flex; justify-content:space-between; gap:8px; font-size:14px; }
.kpiTop .meta { margin:0; }
.kpi .bar { display:block; height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin:4px 0 0; }
.barFill { height:100%; background:var(--brand); }
.formGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-bottom:10px; }
.formGrid label { display:block; font-size:13px; font-weight:600; margin-bottom:2px; }
.repWrap { overflow-x:auto; margin-bottom:10px; }
.rep { border-collapse:collapse; font-size:13px; width:100%; }
.rep th, .rep td { border:1px solid var(--line); padding:4px 6px; text-align:right; white-space:nowrap; }
.rep th:first-child, .rep td:first-child { text-align:left; }
.dayNav { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; margin-bottom:12px; }
.dayNav .btn { min-width:44px; min-height:44px; padding:0 12px; }
.dayName { text-align:center; font-weight:700; }
.dayName .meta { display:block; font-weight:400; margin:0; font-size:13px; }
.why { color:#b3261e; }
.sheetBox textarea { min-height:80px; font:inherit; }
.confirmTick { display:flex !important; align-items:center; gap:10px; font-size:16px !important; min-height:44px; cursor:pointer; }
.confirmTick input { width:24px; height:24px; accent-color:var(--brand); }
.bars { display:flex; gap:6px; align-items:flex-end; overflow-x:auto; min-height:110px; }
.barCol { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; min-width:40px; font-size:11px; color:var(--mute); }

/* Endless templates. A design is one number (its seed). recipe(seed) picks every choice up front, so the same seed always
   draws the same design in the gallery, the editor and the download. Pieces: photo structure × text zone × type style ×
   ornaments × colour tone × wording. Brand rules stay: wording only from LINES and SUBS, colours only from THEMES,
   logo and WhatsApp drawn last by renderSpec, and nothing light sits under the white logo. */
const GEN = 'Vô tận';
const genId = seed => 'g' + (seed >>> 0);
const isGen = id => /^g\d+$/.test(String(id));
const seedOf = id => Number(String(id).slice(1)) >>> 0;

function rng(seed) {
  let a = seed >>> 0;
  const next = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  return { f: next, n: (a, b) => a + (b - a) * next(), i: (a, b) => a + Math.floor(next() * (b - a + 1)), pick: arr => arr[Math.floor(next() * arr.length)], yes: p => next() < p };
}
const lum = hex => { const v = parseInt(String(hex).slice(1), 16); return (.299 * (v >> 16 & 255) + .587 * (v >> 8 & 255) + .114 * (v & 255)) / 255; };
const isLight = hex => lum(hex) > .5;

const STRUCTS = ['full', 'splitH', 'splitV', 'inset', 'shape', 'duo', 'trio', 'quad', 'strips', 'diagonal', 'band', 'window', 'polaroid'];
const TYPOS = ['center', 'leftRule', 'marker', 'pill', 'giant', 'kicker', 'boxed', 'underline'];
const PHOTO_TYPOS = ['center', 'leftRule', 'marker', 'outline', 'pill', 'giant', 'kicker', 'underline'];
const DECOR = ['none', 'frame', 'corners', 'ruleTop', 'dots', 'sideBar', 'square', 'double', 'ring'];

/** Every choice for one design. Numbers are fractions so one recipe fits all three formats. */
function recipe(seed) {
  const r = rng(seed), s = {seed, struct: r.pick(STRUCTS)};
  s.v = {
    zone: r.pick(['bottom', 'bottom', 'center', 'top', 'corner']), ratio: r.n(.52, .68), first: r.yes(.5), gap: r.pick([0, 14, 28]),
    margin: r.pick([48, 70, 100]), radius: r.pick([0, 0, 28, 64]), shadow: r.yes(.5), shape: r.pick(['circle', 'arch', 'diamond', 'hex', 'leaf', 'round']),
    count: r.pick([3, 4]), tilt: r.n(.05, .12) * (r.yes(.5) ? 1 : -1), bandAt: r.pick([.5, .6, .7, .78]), angle: r.n(2, 6) * (r.yes(.5) ? 1 : -1),
    seam: r.yes(.4), plate: r.pick(['circle', 'rect']), dim: r.n(.55, .75), vertical: r.yes(.5),
  };
  s.typo = r.pick(TYPOS); s.photoTypo = r.pick(PHOTO_TYPOS);
  s.decor = [r.pick(DECOR), r.yes(.35) ? r.pick(DECOR) : 'none'];

const CATS = [FULL, BAND, FRAME, SPLIT, SHAPE, GRID, SPEC];

function drawMarks(x, logo, icon, W) {
  const L = BRAND.logo, Q = BRAND.whatsapp, lh = Math.round(logo.naturalHeight * L.width / logo.naturalWidth);
  x.save(); x.globalAlpha = L.opacity; x.shadowColor = BRAND.dark; x.shadowBlur = 5; x.drawImage(logo, L.left, L.top, L.width, lh); x.restore();
  const size = Q.size, gap = Math.round(size * .3), tint = mkCanvas(size, size), t = tint.getContext('2d');
  t.drawImage(icon, 0, 0, size, size); t.globalCompositeOperation = 'source-in'; t.fillStyle = BRAND.whatsappIcon; t.fillRect(0, 0, size, size);
  x.save(); x.globalAlpha = Q.opacity; x.font = `700 ${size}px BrandBold, Arial, sans-serif`; x.textBaseline = 'middle'; x.textAlign = 'left';
  const tw = x.measureText(BRAND.number).width, left = W - Q.right - size - gap - tw, mid = Q.top + size / 2;
  x.drawImage(tint, left, Q.top); x.lineWidth = 4; x.strokeStyle = BRAND.dark; x.lineJoin = 'round';

const PS = {photos: [], assets: null, spec: null, cat: GEN, format: '4:5', theme: 'mix'};
const layoutOf = id => isGen(id) ? {id, cat: GEN, draw: g => genDraw(seedOf(id), g)} : (T.find(v => v.id === id) || T[0]);

/* Each new design gets a fresh seed whose look has not been shown yet in this visit. */
const SEEN = new Set();
function freshSeed() {
  for (let k = 0; k < 400; k++) {
    const seed = (Math.random() * 4294967296) >>> 0, sig = signature(recipe(seed)) + '|' + PS.theme;
    if (!SEEN.has(sig)) { SEEN.add(sig); return seed; }
  }
  return (Math.random() * 4294967296) >>> 0;
}

async function loadAssets() {
  if (PS.assets) return PS.assets;
  await Promise.all([document.fonts.load('800 76px BrandHeavy'), document.fonts.load('700 32px BrandBold')]);
  PS.assets = {logo: await loadImage(ASSETS.logo), icon: await loadImage(ASSETS.icon)};
  return PS.assets;
}
/* iPhone photos are often HEIC. Safari opens them; Chrome and Edge on PC cannot, so those are turned into JPEG on this device

const isHeic = f => /image\/hei[cf]/i.test(f.type) || /\.hei[cf]$/i.test(f.name);
let heicLib = null;
const loadHeic = () => heicLib || (heicLib = new Promise((ok, no) => {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
  s.onload = () => window.heic2any ? ok(window.heic2any) : no(new Error('x'));
  s.onerror = () => no(new Error('x'));
  document.head.append(s);

async function readPhoto(f) {
  const open = async blob => { const u = URL.createObjectURL(blob); try { return await loadImage(u); } finally { URL.revokeObjectURL(u); } };
  if (!isHeic(f)) return open(f);
  try { return await open(f); } catch (e) {}
  const conv = await loadHeic();
  let out;
  try { out = await conv({blob: f, toType: 'image/jpeg', quality: 0.92}); }
  catch (e) { throw new Error('Không đọc được ảnh HEIC ' + f.name + '. Hãy thử ảnh khác hoặc đổi sang JPG.'); }
  return open(Array.isArray(out) ? out[0] : out);
}
async function addPhotos(files, onStep) {
  for (const f of files) {
    if (onStep && isHeic(f)) onStep('Đang đổi ảnh HEIC ' + f.name + ' sang JPG...');

}
function slider(label, min, max, value, onInput, step = 1) {

function chips(items, current, onPick, label) {

  items.forEach(([v, t]) => { const b = el('button', {type:'button', textContent:t}); b.setAttribute('aria-pressed', v === current); b.onclick = () => onPick(v); bar.append(b); });

const groupBox = (title, open, ...kids) => { const d = el('details', {className:'card', open}); d.append(el('summary', {textContent:title}), ...kids); return d; };

  };

let thumbRun = 0, randomBag = [];
/* Goes through every layout and colour tone once, in random order, before repeating. It only changes the preview: nothing is exported. */
function nextLayout() {
  if (Math.random() < .85) return genId(freshSeed());
  if (!randomBag.length) { randomBag = T.map(t => t.id); for (let i = randomBag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [randomBag[i], randomBag[j]] = [randomBag[j], randomBag[i]]; } }

function randomize() {

  PS.spec = old ? {...old, layout, theme: fresh.theme, a: LINES.includes(old.a) ? fresh.a : old.a, b2: SUBS.includes(old.b2) ? fresh.b2 : old.b2} : fresh;

}
const randomButton = label => { const b = el('button', {type:'button', className:'btn', id:'randomBtn', textContent:label}); b.onclick = randomize; return b; };
function gallery() {
  const run = ++thumbRun, grid = el('div', {className:'tpl'}), gen = PS.cat === GEN, ids = gen ? [] : T.filter(t => t.cat === PS.cat);
  const box = el('div', {},
    el('div', {className:'bar'}, randomButton('🎲 Ngẫu nhiên')),
    el('h3', {textContent: gen ? 'Bước 2: chọn mẫu. Kéo xuống là có thêm mẫu mới, không bao giờ hết.' : `Bước 2: chọn mẫu (${ids.length} mẫu làm sẵn trong nhóm này)`}),
    chips(Object.keys(FORMATS).map(k => [k, k === '4:5' ? '4:5 Bài đăng' : k === '1:1' ? '1:1 Vuông' : '9:16 Story']), PS.format, v => { PS.format = v; photos(); }, 'Khổ ảnh'),
    chips([['mix', '🎨 Trộn màu'], ...THEMES.map(t => [t.id, t.name])], PS.theme, v => { PS.theme = v; photos(); }, 'Tông màu'),
    chips([[GEN, '✨ ' + GEN], ...CATS.map(c => [c, `${c} (${T.filter(t => t.cat === c).length})`])], PS.cat, v => { PS.cat = v; photos(); }, 'Nhóm mẫu'),
    grid);

  const [W] = FORMATS[PS.format], scale = 220 / W, queue = [];
  const addTile = id => { const spec = newSpec(id), b = el('button', {type:'button', className:'tile', ariaLabel:'Mẫu ' + id}); b.onclick = () => { PS.spec = spec; photos(); }; grid.append(b); queue.push([spec, b]); };

function editor() {

  let timer; const redraw = () => { clearTimeout(timer); timer = setTimeout(draw, 40); };

    el('div', {className:'bar'}, btn('Xoay 90°', () => { tr().rot = (tr().rot + 90) % 360; redraw(); }), btn('Lật ngang', () => { tr().flip = !tr().flip; redraw(); }), btn('Đặt lại', () => { Object.assign(tr(), {zoom:1, px:0, py:0, rot:0, flip:false}); photos(); })));
  const filter = el('select', {id:'filter'}, ...Object.keys(FILTERS).map(f => el('option', {value:f, textContent:f}))); filter.value = s.filter; filter.onchange = () => { s.filter = filter.value; redraw(); };

  const look = groupBox('Khổ và tông màu', false, chips(Object.keys(FORMATS).map(k => [k, k]), s.format, v => { s.format = v; photos(); }, 'Khổ ảnh'), chips(THEMES.map(t => [t.id, t.name]), s.theme, v => { s.theme = v; photos(); }, 'Tông màu'));
