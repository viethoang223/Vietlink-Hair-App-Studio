:root { --brand:#F04828; --ink:#231A16; --mute:#6f625c; --line:#E7E5E0; --bg:#FAF7F3; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
header { position:sticky; top:0; z-index:2; background:#140000; color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
header h1 { margin:0; font-size:18px; flex:1; }
select, input[type=file], textarea { font:inherit; }
header select { background:#fff; border:0; border-radius:8px; padding:8px 10px; min-height:40px; }
main { max-width:720px; margin:auto; padding:16px; }
nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:2; }
nav button { flex:1; min-height:60px; padding:0 2px; white-space:nowrap; border:0; background:none; font:inherit; font-size:12px; color:var(--mute); cursor:pointer; }
nav button[aria-current=page] { color:var(--brand); font-weight:700; box-shadow:inset 0 3px var(--brand); }
h2 { font-size:20px; margin:0 0 4px; }
h3 { font-size:16px; margin:18px 0 8px; }
.sub { color:var(--mute); margin:0 0 14px; font-size:14px; }
.card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
.card.done { opacity:.55; }
.title { font-weight:700; color:var(--brand); text-decoration:none; font-size:17px; word-break:break-all; }
.meta { color:var(--mute); font-size:14px; margin:4px 0; }
.ticks { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; }
.ticks label { display:flex; align-items:center; gap:6px; min-height:36px; font-size:14px; cursor:pointer; }
.ticks input { width:20px; height:20px; accent-color:var(--brand); }
.btn { display:inline-block; background:var(--brand); color:#fff; border:0; border-radius:99px; padding:11px 20px; font:inherit; font-weight:600; cursor:pointer; min-height:44px; text-decoration:none; }
.btn.line { background:#fff; color:var(--ink); border:1px solid var(--line); padding:6px 14px; min-height:36px; font-size:14px; font-weight:500; }
.btn:disabled { opacity:.5; }
textarea { width:100%; min-height:140px; border:1px solid var(--line); border-radius:10px; padding:10px; }
.field { margin-bottom:12px; }
.field > label { display:block; font-weight:600; margin-bottom:4px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.grid img { width:100%; border-radius:8px; display:block; }
.bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.bar button:not(.btn) { border:1px solid var(--line); background:#fff; border-radius:99px; padding:6px 14px; min-height:38px; font:inherit; font-size:14px; cursor:pointer; }
.bar button:not(.btn)[aria-pressed=true] { background:var(--ink); color:#fff; }
.err { color:#b3261e; margin-top:8px; }
.tag { font-weight:700; }
.login { max-width:340px; margin:18vh auto 0; padding:16px; text-align:center; }
.login input { width:100%; font:inherit; font-size:20px; text-align:center; padding:12px; border:1px solid var(--line); border-radius:10px; margin:12px 0; }
.tpl { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; }
.tile { border:2px solid transparent; background:none; padding:0; border-radius:8px; cursor:pointer; overflow:hidden; line-height:0; min-height:100px; }
.tile:hover, .tile:focus-visible { border-color:var(--brand); }
.tile canvas { width:100%; height:auto; display:block; }
.strip { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; }
.mini { position:relative; flex:none; line-height:0; }
.mini canvas { border-radius:8px; }
.mini .x { position:absolute; top:-2px; right:-2px; width:28px; height:28px; border-radius:50%; border:0; background:#140000; color:#fff; font-size:16px; line-height:1; cursor:pointer; }
.previewBox { text-align:center; }
.preview { max-width:100%; max-height:70vh; border-radius:8px; touch-action:none; cursor:grab; background:#000; }
details.card > summary { font-weight:700; cursor:pointer; min-height:28px; }
details.card[open] > summary { margin-bottom:12px; }
.range { display:grid; grid-template-columns:90px 1fr 38px; gap:8px; align-items:center; margin-bottom:8px; font-size:14px; }
.range input { width:100%; accent-color:var(--brand); }
.val { text-align:right; color:var(--mute); }
.txt { width:100%; font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; }
select { max-width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
.msg { font-size:18px; line-height:1.5; margin:0 0 12px; min-height:54px; }
.linkBtn { background:none; border:0; padding:0; cursor:pointer; font-family:inherit; text-align:left; min-height:28px; text-decoration:underline; }
.sheet { position:fixed; inset:0; background:rgba(20,0,0,.55); z-index:9; display:flex; align-items:flex-end; justify-content:center; }
.sheetBox { background:#fff; width:100%; max-width:520px; max-height:85vh; overflow:auto; border-radius:16px 16px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; position:relative; }
.sheetBox .btn { text-align:center; }
.sheetBox label { display:block; font-weight:600; font-size:14px; margin-top:6px; }
.appRow { display:flex; gap:8px; }
.appRow .btn:first-child { flex:1; }
.x2 { position:absolute; top:10px; right:10px; width:36px; height:36px; border:0; background:none; font-size:24px; line-height:1; cursor:pointer; color:var(--mute); }
.assess { border-top:1px solid var(--line); margin-top:8px; padding-top:8px; }
.tagRow { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:6px; }
.tagName { width:66px; font-size:13px; color:var(--mute); }
.chip { border:1px solid var(--line); background:#fff; border-radius:99px; padding:4px 10px; min-height:32px; font:inherit; font-size:13px; cursor:pointer; }
.chip[aria-pressed=true] { background:var(--ink); color:#fff; }
.tagFoot { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.tagFoot .meta { margin:0; font-size:13px; }
.tier { font-size:12px; font-weight:700; border-radius:6px; padding:2px 8px; background:#E7E5E0; }
.tier[data-tier="Tốt"] { background:#08B917; color:#fff; }
.tier[data-tier="Khá"] { background:#FB923B; color:#140000; }
.tier[data-tier="Yếu"] { background:#231A16; color:#fff; }
header select { max-width:62%; }
.task { display:flex; gap:8px; align-items:flex-start; padding:6px 0; font-size:15px; cursor:pointer; }
.task input { width:20px; height:20px; flex:none; accent-color:var(--brand); }
.kpi { margin-bottom:10px; }
.kpiTop { display:flex; justify-content:space-between; gap:8px; font-size:14px; }
.kpiTop .meta { margin:0; }
.kpi .bar { display:block; height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin:4px 0 0; }
.barFill { height:100%; background:var(--brand); }
.formGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-bottom:10px; }
.formGrid label { display:block; font-size:13px; font-weight:600; margin-bottom:2px; }
.repWrap { overflow-x:auto; margin-bottom:10px; }
.rep { border-collapse:collapse; font-size:13px; width:100%; }
.rep th, .rep td { border:1px solid var(--line); padding:4px 6px; text-align:right; white-space:nowrap; }
.rep th:first-child, .rep td:first-child { text-align:left; }
.dayNav { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; margin-bottom:12px; }
.dayNav .btn { min-width:44px; min-height:44px; padding:0 12px; }
.dayName { text-align:center; font-weight:700; }
.dayName .meta { display:block; font-weight:400; margin:0; font-size:13px; }
.why { color:#b3261e; }
.sheetBox textarea { min-height:80px; font:inherit; }
.confirmTick { display:flex !important; align-items:center; gap:10px; font-size:16px !important; min-height:44px; cursor:pointer; }
.confirmTick input { width:24px; height:24px; accent-color:var(--brand); }
.bars { display:flex; gap:6px; align-items:flex-end; overflow-x:auto; min-height:110px; }
.barCol { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; min-width:40px; font-size:11px; color:var(--mute); }
.barStick { width:18px; background:var(--brand); border-radius:3px 3px 0 0; margin:2px 0; }
[hidden] { display:none !important; }
</style>

<style>
body { padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
header nav { position:static; display:flex; gap:14px; padding:0; background:none; border:0; box-shadow:none; height:auto; width:auto; }
header nav a { color:#FB923B; font-weight:700; font-size:15px; text-decoration:none; }
header nav a[aria-current] { color:#fff; }
main { max-width:1180px; }
.card h3 { margin:0 0 10px; font-size:17px; }
.clip { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
.tog { display:inline-flex; gap:6px; align-items:center; margin-right:14px; font-size:15px; }
.player { display:flex; flex-direction:column; gap:8px; align-items:center; }
.stage { width:100%; max-width:360px; aspect-ratio:9/16; background:#000; border-radius:12px; cursor:pointer; }
.scrub { flex:1; min-width:120px; }
.pickwrap { display:grid; grid-template-columns:minmax(260px,380px) 1fr; gap:18px; align-items:start; }
.variants { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; }
.variant { display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
.variant canvas { width:100%; aspect-ratio:9/16; border-radius:10px; cursor:pointer; border:3px solid transparent; background:#140000; }
.variant.on canvas { border-color:var(--brand); }
.btn.small { min-height:34px; padding:4px 12px; font-size:14px; }
.editwrap { display:grid; grid-template-columns:minmax(260px,380px) 1fr; gap:18px; align-items:start; }
.stickystage { position:sticky; top:64px; }
.seg { border-top:1px solid var(--line); padding:12px 0; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px 14px; }
.result { width:100%; max-width:300px; border-radius:10px; display:block; margin:8px 0; }
progress { width:100%; max-width:420px; height:14px; }
.tlbox { margin-top:16px; }
.keys { font-size:12px; margin:4px 0 8px; }
.checks { list-style:none; padding:0; margin:8px 0; font-size:14px; }
.checks li { padding:4px 0; border-bottom:1px solid var(--line); }
.checks li.err { color:#b3261e; } .checks li.fixed { color:#0a6b2d; font-weight:600; }
.tl { overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:12px; padding:6px 0 10px; -webkit-overflow-scrolling:touch; }
.tlin { position:relative; min-height:200px; }
.tlruler { position:relative; height:22px; cursor:pointer; border-bottom:1px solid var(--line); }
.tlruler span { position:absolute; top:3px; font-size:11px; color:var(--mute); transform:translateX(-50%); }
.tlname { font-size:11px; color:var(--mute); padding:4px 8px 2px; }
.tlrow { position:relative; height:100px; cursor:pointer; }
.tlrow.texts { height:40px; }
.tlb { position:absolute; top:2px; bottom:2px; border-radius:8px; overflow:hidden; display:flex; align-items:center; font-size:12px; font-weight:700; color:#fff; box-sizing:border-box; border:2px solid transparent; user-select:none; touch-action:none; }
.tlb.on { border-color:#FB923B; box-shadow:0 0 0 2px #140000 inset; }
.tlb.seg { background:#5a3a30; } .tlb.seg.tC { background:#7b2d1c; } .tlb.seg.tB { background:#3d4a5c; } .tlb.seg.tA { background:#2f5a46; } .tlb.seg.tD { background:#5c4a2a; }
.tlb.card { background:#140000; justify-content:center; }
.tlb.txt { background:#F04828; padding:0 14px; white-space:nowrap; cursor:grab; }
.tllab { display:flex; align-items:center; gap:6px; padding-left:4px; white-space:nowrap; }
.tthumb { width:40px; height:72px; border-radius:4px; background:#000; flex:none; }
.tlh { position:absolute; top:0; bottom:0; right:0; width:14px; cursor:ew-resize; background:rgba(255,255,255,.35); touch-action:none; z-index:3; }
.tlb.on { z-index:2; }
.tlh.left { left:0; right:auto; }
.tlplay { position:absolute; top:0; bottom:0; width:2px; background:#EB1C24; pointer-events:none; }
.tlplay::before { content:''; position:absolute; top:0; left:-5px; border:6px solid transparent; border-top-color:#EB1C24; }
@media (pointer:coarse) { .tlh { width:26px; } .tlrow { height:110px; } .tlrow.texts { height:52px; } }
@media (max-width:720px) { .pickwrap, .editwrap { grid-template-columns:1fr; } .stickystage { position:static; } }
</style>

   - a video segment points to 7 helper materials (speed, placeholder, canvas, animation, channel mapping, colour,

   - video keyframe times are source start + time into the segment; text keyframes count from the segment start;
   - positions are -1..1 from the centre (y up), media are fitted inside the canvas before clip.scale applies.

   downloads any that are not on the machine yet. */

}

/** Text for support when an export fails: browser, what its encoders accept, and each attempt. */
async function exportReport(err) {

  for (const d of (err && err.details) || []) lines.push('  ' + d);

    lines.push('H.264 high: ' + await test('avc1.640028'), 'H.264 main: ' + await test('avc1.4d0028'), 'H.264 baseline: ' + await test('avc1.42e028'),
      'CBR: ' + await test('avc1.640028', {bitrateMode: 'constant'}), 'VBR: ' + await test('avc1.640028', {bitrateMode: 'variable'}));
  } else lines.push('Không có VideoEncoder');

}

/* Vietlink video studio, CapCut check-and-fix. Runs in the browser on the CapCut project folder the user granted
   (File System Access), no server. checkCapcut() lists what it finds; with fix = true it also repairs what it safely
   can. It only edits projects whose name starts with "Vietlink" and CapCut's project list (root_meta_info.json),
   which it backs up first. Things outside the browser (CapCut settings, closing CapCut) come back as steps to follow.

/**
 * dir: the CapCut project folder handle (may be null). fix: repair as well as check. clips: clips still open in the

async function checkCapcut(dir, {fix = false, clips = [], confirmDelete = () => false} = {}) {
  const out = [], say = (level, text, fixable = false) => { out.push({level, text, fixable}); };

  say('warn', 'Nhớ tắt hẳn CapCut trước khi tạo hoặc sửa dự án (trang không tự kiểm tra được CapCut có đang mở không).');

        }

      } else say('err', '"' + name + '": dự án tạo dở (thiếu draft_content.json), nên xóa đi rồi tạo lại.', true);

    }

        else if (fix && f === 'whatsapp.png' && typeof ASSET_IMG !== 'undefined' && ASSET_IMG.iconGreen) { await writeFile(draft, 'materials/whatsapp.png', await new Promise(ok => ASSET_IMG.iconGreen.toBlob(ok, 'image/png'))); back.push(f); }

        + 'Nếu là clip: tải lại đúng clip gốc lên trang rồi bấm Tự sửa. Nếu không: xóa dự án này rồi bấm Mở trong CapCut lần nữa.');
    }
    /* 3b'. the file this machine's CapCut opens (draft_info.json on the Mac app) */
    if (prof.contentName !== 'draft_content.json' && !(await exists(draft, prof.contentName))) {
      if (fix) { await writeFile(draft, prof.contentName, JSON.stringify(content)); say('fixed', '"' + name + '": đã thêm file ' + prof.contentName + ' mà CapCut trên máy này cần để mở dự án.'); }
      else say('err', '"' + name + '": thiếu file ' + prof.contentName + ' nên CapCut trên máy này hiện dự án nhưng không mở được.', true);
    }
    /* 3c. it must be in CapCut's list, with the right folder */
    const entry = entries.find(e => e.draft_name === name);
    if (!entry) {
      if (fix) {
        let meta = {}; try { meta = JSON.parse(await readText(draft, 'draft_meta_info.json')); } catch (e) {}
        const now = Date.now() * 1000, sep = real.includes(':') ? '\\' : '/';
        entries.unshift(Object.assign(JSON.parse(JSON.stringify(CAPCUT_T.root_entry)), {draft_id: meta.draft_id || ccUuid(), draft_name: name, draft_fold_path: fold, draft_root_path: real.replace(/\//g, sep),
          draft_json_file: fold + sep + prof.contentName, draft_cover: '', tm_draft_create: meta.tm_draft_create || now, tm_draft_modified: now, tm_duration: content.duration || 0, tm_draft_removed: 0}));
        rootChanged = true; say('fixed', '"' + name + '": đã thêm lại vào danh sách CapCut (thường do CapCut đang mở lúc tạo dự án).');
      } else say('err', '"' + name + '": có trong thư mục nhưng không có trong danh sách CapCut, nên CapCut không hiện.', true);
    } else if (norm(entry.draft_fold_path) !== fold) {
      if (fix) { const sep = real.includes(':') ? '\\' : '/'; entry.draft_fold_path = fold; entry.draft_root_path = real.replace(/\//g, sep); entry.draft_json_file = fold + sep + prof.contentName; rootChanged = true; say('fixed', '"' + name + '": đã sửa đường dẫn trong danh sách CapCut.'); }
      else say('err', '"' + name + '": danh sách CapCut ghi sai thư mục của dự án này.', true);
    }
    const ent = entries.find(e => e.draft_name === name);
    if (ent && !norm(ent.draft_json_file).endsWith('/' + prof.contentName) && !String(ent.draft_json_file || '').endsWith(prof.contentName)) {
      if (fix) { const sep = real.includes(':') ? '\\' : '/'; ent.draft_json_file = fold + sep + prof.contentName; rootChanged = true; say('fixed', '"' + name + '": danh sách CapCut giờ trỏ vào ' + prof.contentName + '.'); }
      else say('err', '"' + name + '": danh sách CapCut trỏ vào file nội dung khác với file CapCut trên máy này dùng.', true);
    }
    if (!out.some(r => r.text.startsWith('"' + name + '"'))) say('ok', '"' + name + '": ổn.');
  }
  /* entries for Vietlink projects whose folder is gone */
  const gone = entries.filter(e => VL_PREFIX.test(e.draft_name || '') && norm(e.draft_fold_path).startsWith(real + '/') && !names.includes(e.draft_name));
  if (gone.length) {
    if (fix) { root.all_draft_store = entries.filter(e => !gone.includes(e)); rootChanged = true; say('fixed', 'Đã bỏ ' + gone.length + ' dự án Vietlink không còn thư mục khỏi danh sách CapCut.'); }
    else say('warn', gone.length + ' dự án Vietlink trong danh sách CapCut không còn thư mục.', true);
  }
  if (rootChanged) {
    await writeFile(dir, 'root_meta_info.json.bak-vietlink-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, ''), rootText);
    await writeFile(dir, 'root_meta_info.json', JSON.stringify(root));
    say('ok', 'Đã lưu danh sách CapCut (bản cũ được sao lưu trong cùng thư mục).');
  }
  if (!out.some(r => r.level === 'err' || (r.fixable && r.level !== 'fixed'))) say('ok', fix ? 'Xong. Mở CapCut để xem.' : 'Không thấy lỗi nào.');
  return out;
}
/** Plain-text report to paste in a message when something is still wrong. */
function checkReport(list) {
  const icon = {ok: '✅', warn: '⚠️', err: '❌', fixed: '🔧'};
  return ['Báo cáo kiểm tra Vietlink → CapCut', new Date().toLocaleString('vi-VN'), navigator.userAgent, '', ...list.map(r => icon[r.level] + ' ' + r.text)].join('\n');

/** The CapCut folder chosen earlier (asks for permission again if the browser dropped it), or null. */
async function savedCapcutDir() {
  if (!canCapcut()) return null;
  const dir = await idb('readonly', st => st.get('capcutDir')).catch(() => null);
  if (!dir) return null;
  let perm = await dir.queryPermission({mode: 'readwrite'});
  if (perm !== 'granted') perm = await dir.requestPermission({mode: 'readwrite'});
  return perm === 'granted' ? dir : null;
}

  p.onTime = t => { time.max = p.L.total; time.value = t; btn.textContent = p.playing ? '❚❚ Dừng' : '▶ Phát'; lab.textContent = fmt(t) + ' / ' + fmt(p.L.total); };

      return card('Dòng chữ ' + (s.i + 1), el('div', {className: 'field'}, input, preset),
        el('div', {className: 'grid2'},
          el('div', {className: 'field'}, el('label', {textContent: 'Kiểu chữ'}), select(TEXT_STYLES, tx.style, v => { tx.style = v; update(false); }, 'Kiểu chữ')),
          el('div', {className: 'field'}, el('label', {textContent: 'Hiệu ứng chữ'}), select(TEXT_ANIMS, tx.anim, v => { tx.anim = v; update(false); P.seek(L.bodyStart + tx.start); P.play(); }, 'Hiệu ứng chữ')),
          el('div', {className: 'field'}, el('label', {textContent: 'Vị trí'}), select(TEXT_POS, tx.pos, v => { tx.pos = v; delete tx.y; update(false); }, 'Vị trí')),
          el('div', {className: 'field'}, el('label', {textContent: 'Màu nhấn'}), select({brand: 'Đỏ cam', orange: 'Cam', red: 'Đỏ', dark: 'Đen ấm'}, tx.color, v => { tx.color = v; update(false); }, 'Màu nhấn'))),
        range('Hiện từ', 0, Math.max(.1, body).toFixed(1), .1, Math.min(tx.start, body).toFixed(1), v => { tx.start = Math.min(v, tx.end - .5); update(false); }, v => v.toFixed(1) + ' s'),
        range('Đến', .5, Math.max(.6, body).toFixed(1), .1, Math.min(tx.end, body).toFixed(1), v => { tx.end = Math.max(v, tx.start + .5); update(false); }, v => v.toFixed(1) + ' s'),
        range('Cỡ chữ', 60, 140, 1, Math.round((tx.size || 1) * 100), v => { tx.size = v / 100; update(false); }, v => v + '%'),
        el('p', {className: 'sub', textContent: 'Chỉ ghi điều có thật, không tự thêm giá hay cam kết.'}),
        el('button', {type: 'button', className: 'btn line small', textContent: 'Xóa dòng chữ này', onclick: () => { e.texts.splice(s.i, 1); VS.sel = null; update(); }}));
    }
    VS.sel = null; return inspector();
  };

  const overall = () => card('Tổng thể',
    range('Cường độ', 0, 100, 1, e.intensity, v => { e.intensity = v; }, v => v + ' · ' + intensityName(v)),
    el('div', {className: 'bar'}, el('button', {type: 'button', className: 'btn line', textContent: '🎲 Dựng lại theo cường độ này (giữ chữ)', onclick: () => {
      const fresh = generate(newSeed(), VS.clips, {...VS.opts, intensity: e.intensity, intro: !!e.intro, outro: !!e.outro, audio: e.audio});
      Object.assign(e, {...fresh, texts: e.texts, intro: e.intro && fresh.intro ? {...fresh.intro, style: e.intro.style} : fresh.intro, outro: e.outro && fresh.outro ? {...fresh.outro, style: e.outro.style} : fresh.outro}); VS.sel = null; update();
    }})),
    el('div', {className: 'bar'}, toggle('Intro', !!e.intro, v => { e.intro = v ? {style: 'dark', dur: 1.4} : null; VS.sel = null; update(); }), toggle('Outro', !!e.outro, v => { e.outro = v ? {style: 'cta', dur: 2.6} : null; VS.sel = null; update(); }), toggle('Giữ tiếng gốc', e.audio, v => { e.audio = v; update(false); })),
    el('div', {className: 'grid2'},
      el('div', {className: 'field'}, el('label', {textContent: 'Tông màu'}), select(LOOKS, e.look, v => { e.look = v; if (v !== 'none' && !e.lookAmt) e.lookAmt = .5; update(); }, 'Tông màu')),
      e.look !== 'none' ? range('Độ đậm màu', 0, 100, 1, Math.round(e.lookAmt * 100), v => { e.lookAmt = v / 100; update(false); }) : el('div')),
    el('div', {className: 'bar'}, ...Object.entries(FX_NAMES).map(([k, t]) => toggle(t, !!e.fx[k], v => { e.fx[k] = v; update(false); }))));

  const exporter = () => {
    const out = el('div'), go = el('button', {type: 'button', className: 'btn', textContent: '⬇ Xuất MP4'}), stop = el('button', {type: 'button', className: 'btn line', textContent: 'Hủy', hidden: true});
    let cancel = false;
    stop.onclick = () => { cancel = true; };
    go.onclick = async () => {
      P.pause(); go.disabled = true; stop.hidden = false; cancel = false;
      const bar = el('progress', {max: 1, value: 0}), lab = el('span', {className: 'sub'}); out.replaceChildren(bar, lab);
      const t0 = performance.now(), lock = await keepAwake();
      try {
        const blob = await exportMp4(e, VS.clips, (p, m) => { bar.value = p; lab.textContent = ' ' + m + ' ' + Math.round(p * 100) + '%'; }, () => cancel);
        out.replaceChildren(...savePanel(blob, 'vietlink_' + e.seed + '.mp4', Math.round((performance.now() - t0) / 1000)));
      } catch (err) {
        if (err.message === 'cancelled') out.replaceChildren(el('p', {className: 'sub', textContent: 'Đã hủy.'}));
        else {
          const rep = el('button', {type: 'button', className: 'btn line small', textContent: '📋 Sao chép chi tiết lỗi'});
          rep.onclick = async () => { try { await navigator.clipboard.writeText(await exportReport(err)); rep.textContent = '✅ Đã chép, dán gửi người hỗ trợ'; } catch (x) { rep.textContent = 'Không chép được'; } };
          out.replaceChildren(el('p', {className: 'err', textContent: 'Không xuất được: ' + err.message}), rep);
        }
      }
      if (lock) lock.release().catch(() => {});
      go.disabled = false; stop.hidden = true;
    };
    /* Send to CapCut: writes a real CapCut project with every layer separate, to keep editing there. */
    const cc = el('button', {type: 'button', className: 'btn line', textContent: '🎬 Mở trong CapCut'}), ccOut = el('div');
    const runCapcut = async forcePick => {
      P.pause(); cc.disabled = true;
      const bar = el('progress', {max: 1, value: 0}), lab = el('span', {className: 'sub'}); ccOut.replaceChildren(bar, lab);
      try {
        const name = await sendToCapcut(e, VS.clips, (p, m) => { bar.value = p; lab.textContent = ' ' + m; }, forcePick);
        const b = el('b', {textContent: name});
        ccOut.replaceChildren(el('p', {}, '✅ Đã tạo dự án ', b, ' trong CapCut. Mở CapCut (nếu đang mở thì tắt hẳn rồi mở lại): dự án nằm đầu danh sách, mọi lớp tách rời để chỉnh tiếp.'),
          el('button', {type: 'button', className: 'btn line small', textContent: 'Chọn lại thư mục CapCut', onclick: () => runCapcut(true)}));
      } catch (err) {
        if (err.name === 'AbortError') ccOut.replaceChildren(el('p', {className: 'err', textContent: 'Chưa chọn được thư mục. Nếu Chrome báo thư mục chứa tệp hệ thống: Chrome không cho trang web mở thư mục trong AppData, nơi CapCut lưu dự án mặc định.'}), el('p', {textContent: 'Cách xử lý (làm một lần): tạo thư mục thường, ví dụ D:\\CapCut Drafts → mở CapCut, vào Cài đặt → Global settings → Draft location (Vị trí bản nháp), chọn thư mục đó → tắt CapCut, mở lại một lần rồi tắt → bấm lại Mở trong CapCut và chọn thư mục mới.'}), el('button', {type: 'button', className: 'btn line small', textContent: 'Chọn lại', onclick: () => runCapcut(true)}), fixBtn());
        else if (err.message === 'wrongdir') ccOut.replaceChildren(el('p', {className: 'err', textContent: 'Thư mục "' + err.dirName + '" không phải thư mục dự án của CapCut. Hãy chọn đúng thư mục "Save to" trong CapCut → Settings → Draft (xem hướng dẫn ở trên).'}), el('button', {type: 'button', className: 'btn line small', textContent: 'Chọn lại', onclick: () => runCapcut(true)}), fixBtn());
        else ccOut.replaceChildren(el('p', {className: 'err', textContent: 'Không tạo được dự án CapCut: ' + err.message}), fixBtn());
      }
      cc.disabled = false;
    };
    cc.onclick = () => runCapcut(false);
    /* Check and fix: looks through the CapCut folder and repairs what it can (see capcut_fix.js). */
    const icon = {ok: '✅', warn: '⚠️', err: '❌', fixed: '🔧'};
    const runCheck = async fix => {
      P.pause(); ccOut.replaceChildren(el('p', {className: 'sub', textContent: fix ? 'Đang kiểm tra và sửa...' : 'Đang kiểm tra...'}));
      let list;
      try {
        let dir = await savedCapcutDir();
        if (!dir && canCapcut()) {
          ccOut.replaceChildren(el('p', {className: 'sub', textContent: 'Chọn thư mục dự án của CapCut (thư mục "Save to" trong CapCut → Settings → Draft; Mac mặc định: ~/Movies/CapCut/User Data/Projects/com.lveditor.draft, trong hộp chọn bấm Cmd+Shift+G để dán).'}));
          try { dir = await window.showDirectoryPicker({id: 'capcut-drafts', mode: 'readwrite'}); await idb('readwrite', st => st.put(dir, 'capcutDir')).catch(() => {}); } catch (x) { dir = null; }
        }
        list = await checkCapcut(dir, {fix, clips: VS.clips, confirmDelete: t => window.confirm(t)});
      }
      catch (err) { list = [{level: 'err', text: 'Lỗi khi kiểm tra: ' + err.message}]; }
      const copy = el('button', {type: 'button', className: 'btn line small', textContent: '📋 Sao chép báo cáo'});
      copy.onclick = async () => { try { await navigator.clipboard.writeText(checkReport(list)); copy.textContent = '✅ Đã chép, dán gửi người hỗ trợ'; } catch (x) { copy.textContent = 'Không chép được'; } };
      const canFix = !fix && list.some(r => r.fixable);
      ccOut.replaceChildren(el('ul', {className: 'checks'}, ...list.map(r => el('li', {className: r.level}, icon[r.level] + ' ' + r.text))),
        el('div', {className: 'bar'}, canFix ? el('button', {type: 'button', className: 'btn', textContent: '🔧 Tự sửa các lỗi trên', onclick: () => runCheck(true)}) : null,
          el('button', {type: 'button', className: 'btn line small', textContent: 'Chọn lại thư mục', onclick: () => runCapcut(true)}), copy));
    };
    const fixBtn = () => el('button', {type: 'button', className: 'btn small', textContent: '🔧 Tự sửa', onclick: () => runCheck(true)});
    const checkBtn = el('button', {type: 'button', className: 'btn line', textContent: '🩺 Kiểm tra', disabled: !canCapcut(), onclick: () => runCheck(false)});
    const ccHelp = canCapcut()
      ? el('details', {className: 'sub'}, el('summary', {textContent: 'Lần đầu: chọn thư mục dự án của CapCut'}),
          el('p', {textContent: 'Tắt CapCut trước khi bấm, rồi chọn thư mục dự án của CapCut (thư mục có file root_meta_info.json). Chrome không cho mở thư mục trong AppData, nơi CapCut lưu mặc định, nên lần đầu hãy đổi chỗ lưu: tạo thư mục thường, ví dụ D:\\CapCut Drafts → mở CapCut, vào Cài đặt → Global settings → Draft location (Vị trí bản nháp), chọn thư mục đó → tắt CapCut, mở lại một lần rồi tắt → bấm lại Mở trong CapCut và chọn thư mục mới.'}),
          el('p', {}, el('b', {textContent: 'Chỗ lưu mặc định của CapCut (để tìm dự án cũ), Windows: '}), '%LOCALAPPDATA%\\CapCut\\User Data\\Projects\\com.lveditor.draft'),
          el('p', {}, el('b', {textContent: 'Mac: '}), 'trong hộp chọn bấm Cmd+Shift+G, dán ~/Movies/CapCut/User Data/Projects/com.lveditor.draft'),
          el('p', {textContent: 'Trình duyệt nhớ thư mục này cho các lần sau. Clip được chép vào dự án mới, file gốc của bạn và các dự án cũ không bị đụng tới.'}))
      : el('p', {className: 'sub', textContent: 'Mở trong CapCut cần Chrome hoặc Edge (Safari chưa cho trang web ghi vào thư mục trên máy).'});
    if (!canCapcut()) cc.disabled = true;
    return el('div', {}, card('Xuất video', el('p', {className: 'sub', textContent: 'MP4 1080×1920, 30 hình/giây, đúng chuẩn Reels và TikTok. Giữ trang này mở trong lúc xuất.'}), el('div', {className: 'bar'}, go, stop), out),
      card('Chỉnh tiếp trong CapCut', el('p', {className: 'sub', textContent: 'Tạo một dự án CapCut từ bản này: từng đoạn cảnh, chữ, logo, số WhatsApp, chuyển cảnh, hiệu ứng và bộ lọc là lớp riêng để bạn tự chỉnh.'}), el('div', {className: 'bar'}, cc, checkBtn), ccHelp, ccOut));
  };

  view.replaceChildren(el('div', {className: 'bar'}, el('button', {type: 'button', className: 'btn line', textContent: '← Chọn bản khác', onclick: () => { VS.sel = null; pick(); }})),
    el('h2', {textContent: 'Chỉnh sửa'}), el('div', {className: 'editwrap'}, el('div', {className: 'stickystage'}, stage), side), tlBox);
  P.set(e); paint();
}
/** Keeps a phone screen on while exporting, where the browser allows it. */
async function keepAwake() { try { return navigator.wakeLock ? await navigator.wakeLock.request('screen') : null; } catch (e) { return null; } }
/** Result of an export: preview, download link, and on phones the share sheet (which offers "Save video"). */
function savePanel(blob, name, secs) {
  const url = URL.createObjectURL(blob), file = new File([blob], name, {type: 'video/mp4'}), kids = [
    el('p', {textContent: 'Xong sau ' + secs + ' giây · ' + (blob.size / 1048576).toFixed(1) + ' MB'}),
    el('video', {src: url, controls: true, playsInline: true, className: 'result'}),
    el('a', {className: 'btn', href: url, download: name, textContent: '⬇ Tải về ' + name})];
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    const sh = el('button', {type: 'button', className: 'btn line', textContent: '📲 Lưu vào máy / Chia sẻ'});
    sh.onclick = () => navigator.share({files: [file]}).catch(() => {});
    kids.push(sh, el('p', {className: 'sub', textContent: 'Trên iPhone: bấm Lưu vào máy / Chia sẻ rồi chọn Lưu video để video vào Ảnh.'}));
  } else kids.push(el('p', {className: 'sub', textContent: 'Nếu không tải được: mở video, nhấn giữ rồi chọn Lưu.'}));
  return kids;
}

(async () => {
  if (!('VideoDecoder' in window && 'VideoEncoder' in window)) { view.replaceChildren(el('h2', {textContent: 'Trình duyệt này chưa dựng được video'}), el('p', {textContent: 'Hãy mở trang bằng Chrome hoặc Edge bản mới trên máy tính, hoặc Safari trên iPhone iOS 17 trở lên.'})); return; }
  try { await loadAssets(); await loadMB(); setup(); }
  catch (e) { view.replaceChildren(el('p', {className: 'err', textContent: 'Không khởi động được: ' + e.message})); }
})();
